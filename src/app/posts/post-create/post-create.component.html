<mat-card>
  @if (isLoading) {
    <mat-spinner></mat-spinner>
  }
  @if (!isLoading) {
    <form [formGroup]="form" (submit)="onSavePost()">
      <mat-form-field>
        <input
          matInput
          type="text"
          formControlName="title"
          placeholder="Post Title">
          @if (form.get('title')?.invalid) {
            <mat-error>Please enter a post title</mat-error>
          }
        </mat-form-field>
        <div>
          <button mat-stroked-button type="button" (click)="fileSelector.click()">Select image</button>
          <input type="file" #fileSelector (change)="onImageSelected($event)">
        </div>
        @if (imagePreview) {
          <div class="image-preview">
            <img [src]="imagePreview" [alt]="form.value.title">
          </div>
        }
        @if (form.get('image')?.invalid && mode === 'create') {
          <mat-error>
            Please select a valid image
          </mat-error>
        }
        <mat-form-field>
          <textarea
            matInput
            rows="4"
            formControlName="content"
            placeholder="Post Content">
          </textarea>
          @if (form.get('content')?.invalid) {
            <mat-error>Please enter a post content</mat-error>
          }
        </mat-form-field>
        <button mat-raised-button color="accent" type="submit">Save Post</button>
      </form>
    }
  </mat-card>
